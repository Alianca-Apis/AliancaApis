<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliança Apis | Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/imgs/logo_bn.png">
    <script src="./js/script.js"></script>
    <script src="https://kit.fontawesome.com/a6f961102e.js" crossorigin="anonymous"></script>
</head>

<style>
    body {
        background-image:
            linear-gradient(#f9f6ed7c, #e5e3d681),
            url('./assets/imgs/imagem2-home.png');

        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
    }
</style>

<body class="bodyCadastro" style="padding-top: 0px;" onload="sessionStorage.clear();">
    <div class="loginContainer">
        <div class="cardLogin">
            <div class="input-row" style="justify-content: space-between;">
                <h2>Identificação</h2>
                <a href="index.html" class="voltar-dashboard">Voltar<i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div class="detalheLinhaLogin"></div>

            <div class="input-group">
                <span for="ipt_nome">Email:</span>
                <input type="text" placeholder="Email:" id="ipt_email">
            </div>

            <div class="input-group">
                <span for="ipt_sobrenome">Senha:</span>
                <input type="password" placeholder="Senha:" id="ipt_senha">
            </div>

            <button onclick="entrar()">Entrar</button>
            <div id="div_erro"></div>
        </div>
    </div>

    <div class="copyrightFooterInv">
        <div class="logoFooter">
            <img src="./assets/imgs/logo_bn.png">
        </div>

        <p>Copyright © 2010-2026 Aliança Apis All rights reserved.</p>
    </div>
</body>
</html>
