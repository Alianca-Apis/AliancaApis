<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliança Apis | Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/imgs/logo_bn.png">
    <script src="https://kit.fontawesome.com/a6f961102e.js" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</head>

<style>
    body {
        background-image:
            linear-gradient(#f9f6ed7c, #e5e3d681),
            url('./assets/imgs/imagem2-home.png');
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
    }
</style>

<body class="bodyCadastro" style="padding-top: 0px;">
    <div class="loginContainer">
        <div class="cardLogin">
            <div class="input-row" style="justify-content: space-between;">
                <h2> Cadastrar Funcionário</h2>
                <a href="./dashboard/dashboard.html" class="voltar-dashboard">Voltar<i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div class="detalheLinhaLogin"></div>

            <div class="input-row">
                <div class="input-group">
                    <span for="ipt_nome">Nome:</span>
                    <input type="text" id="ipt_nome" placeholder="Ex: João">
                </div>
                <div class="input-group">
                    <span for="ipt_sobrenome">Sobrenome:</span>
                    <input type="text" id="ipt_sobrenome" placeholder="Ex: Silva">
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <span for="ipt_email">Email:</span>
                    <input type="text" id="ipt_email" placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <span for="ipt_sobrenome">Tipo de usuário:</span>
                    <select name="" id="tipo">
                        <option value="producao">Produção</option>
                        <option value="gestor">Gestor</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <span for="ipt_senha">Senha:</span>
                <input type="password" id="ipt_senha" placeholder="********">
            </div>

            <div class="input-group">
                <span for="ipt_confirmacaoSenha">Confirme sua senha:</span>
                <input type="password" id="ipt_confirmacaoSenha" placeholder="********">
            </div>

            <button onclick="cadastrar()" class="btn_principalMarrom">Cadastrar</button>

            <div id="div_erro"></div>
        </div>
    </div>

    <div class="copyrightFooterInv">
        <div class="logoFooter">
            <img src="./assets/imgs/logo_bn.png">
        </div>
        <p>Copyright © 2010-2026 Aliança Apis All rights reserved.</p>
    </div>

</body>

</html>
