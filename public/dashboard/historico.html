<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard Aliança Apis</title>
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <script src="https://kit.fontawesome.com/a6f961102e.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/sessao.js"></script>
</head>

<body style="margin-top: 0px;">

    <!-- FIM HEADER-->

    <section class="main">
<div class="sidebar" id="sidebar">
    <a href="../index.html"><i class="fa-solid fa-house"></i>Home</a>
    <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i>Relatórios</a>
    <a href="apiarios.html"><i class="fa-solid fa-jar"></i>Apiários</a>
    <a class="sidebar-active" href="historico.html"><i class="fa-solid fa-clock-rotate-left"></i>Histórico</a>
    <a href="/public/cadastro.html" style="display: none;"><i class="fa-solid fa-user-plus"></i>Cadastro</a>
    <a href="../login.html"><i class="fa-solid fa-right-from-bracket"></i>Sair</a>
    <hr>
</div>

        <div class="content content-apiario">
            <div class="titulo-sessão">
                <h2>Histórico de ocorrências</h2>
                <hr>
                <div class="filtro-historico" aria-label="Filtro de ordenação do histórico">
                    <label for="ordenar-historico">Ordenar por</label>
                    <select id="ordenar-historico" name="ordenar-historico">
                        <option value="dataHora">Data</option>
                        <option value="descricaoAlerta">Apiário</option>
                    </select>

                    <select id="ordenar-historico2" name="ordenar-historico2">
                        <option value="DESC">Decrescente</option>
                        <option value="ASC">Crescente</option>
                    </select>
                </div>
                <br>
            </div>
            <div id="historico_alertas" class="cards-apiarios"></div>
        </div>
    </section>


    <script src="../js/gestor.js"></script>

    <script>

        const historicoContainer = document.getElementById("historico_alertas");

        function formatarDataHora(dataHora) {
            if (!dataHora) {
                return "Data não informada";
            }

            const data = new Date(dataHora);

            if (Number.isNaN(data.getTime())) {
                return String(dataHora);
            }

            return data.toLocaleString("pt-BR");
        }

        function criarCardHistorico(alerta) {
            const idApiario = alerta.idApiario;
            const descricaoAlerta = alerta.descricaoAlerta ?? "Sem descrição";
            const dataHora = alerta.dataHora

            return `
            <div class="box-info apiario">
                <div class="card-unidade apiario vermelho">
                    <div class="info-text">
                        <h3>Apiário ${idApiario}</h3>
                        <p>Descrição: ${descricaoAlerta}</p>
                        <p>Data: ${formatarDataHora(dataHora)}</p>
                    </div>
                </div>
            
            </div>
        `;
        }

        function montarQueryHistorico() {
            const ordenarPor = document.getElementById("ordenar-historico").value;
            const ordem = document.getElementById("ordenar-historico2").value;
            const empresaId = sessionStorage.EMPRESA_ID;

            return `?ordenarPor=${ordenarPor}&ordem=${ordem}&empresaId=${empresaId}`;
        }

        async function carregarHistoricoAlertas() {
            try {
                const resposta = await fetch(`/avisos/historico-alertas${montarQueryHistorico()}`);

                if (resposta.status === 204) {
                    historicoContainer.innerHTML = "<p>Nenhum alerta registrado.</p>";
                    return;
                }

                if (!resposta.ok) {
                    historicoContainer.innerHTML = "<p>Não foi possível carregar o histórico.</p>";
                    return;
                }

                const historico = await resposta.json();
                historicoContainer.innerHTML = historico.map(criarCardHistorico).join("")
            } catch (erro) {
                console.error("Erro ao carregar histórico de alertas:", erro);
                historicoContainer.innerHTML = "<p>Erro de conexão ao carregar o histórico.</p>";
            }
        }

        document.getElementById("ordenar-historico").addEventListener("change", carregarHistoricoAlertas);
        document.getElementById("ordenar-historico2").addEventListener("change", carregarHistoricoAlertas);

        carregarHistoricoAlertas();
    </script>

</body>

</html>
