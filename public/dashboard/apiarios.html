<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoard Aliança Apis</title>
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <script src="https://kit.fontawesome.com/a6f961102e.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="margin-top: 0px;">
    <section class="main">
        <div class="sidebar" id="sidebar">
            <a href="../index.html"><img src="../assets/imgs/logo-main.png"></a>
            <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i>Relatórios</a>
            <a class="sidebar-active" href="apiarios.html"><i class="fa-solid fa-jar"></i>Apiários</a>
            <a href="historico.html"><i class="fa-solid fa-clock-rotate-left"></i>Histórico</a>
            <hr>
        </div>

        <div class="content content-apiario">
            <div class="titulo-sessão">
                <h2>Apiários</h2>
                <hr>
                <br>
            </div>
            <div id="container_cards_apiarios" class="cards-apiarios">
            </div>
        </div>
    </section>

    <script src="../js/sessao.js"></script>

    <script>
        const card = document.getElementById("container_cards_apiarios");

        function obterClasseTemperatura(temperatura) {
            const valor = Number(temperatura);

            if (valor >= 35 && valor <= 36.5) {
                return "verde";
            }
            if ((valor > 36.5 && valor <= 38.5) || (valor >= 33 && valor < 35)) {
                return "amarelo";
            }
            return "vermelho";
        }

        function formatarTemperatura(valor) {
            if (valor == null || valor == undefined || valor == "" || Number.isNaN(Number(valor))) {
                return "Sem leitura";
            }

            return `${Number(valor).toFixed(1)}°C`;
        }

        function criarCard(apiario) {
            const temperaturaAtual = apiario.temperaturaAtual;
            const classeTemperatura = obterClasseTemperatura(temperaturaAtual);
            const temperaturaMedia = apiario.temperaturaMedia;

            return `
            <div class="box-info apiario">
                <div id="card_${apiario.idApiario}" class="card-unidade apiario ${classeTemperatura}">
                    <div class="info-text">
                        <h3>Apiário ${apiario.idApiario}</h3>
                        <h5>${apiario.descricao}</h5>
                        <p id="temp_aquario_${apiario.idApiario}">Temperatura atual: ${formatarTemperatura(temperaturaAtual)}</p>
                        <p>Temperatura média: ${formatarTemperatura(temperaturaMedia)}</p>
                    </div>
                </div>
            </div>`;
        }

        async function carregarApiarios() {
            const empresaId = sessionStorage.EMPRESA_ID;

            if (!empresaId) {
                window.location = "../login.html";
                return;
            }

            try {
                const resposta = await fetch(`/apiarios/${empresaId}`);

                if (resposta.status === 204) {
                    card.innerHTML = "<p>Nenhum apiário cadastrado para esta empresa.</p>";
                    return;
                }
                if (!resposta.ok) {
                    card.innerHTML = "<p>Não foi possível carregar os apiários.</p>";
                    return;
                }

                const lista = await resposta.json();

                sessionStorage.APIARIOS = JSON.stringify(
                    lista.map((item) => ({
                        id: item.idApiario,
                        descricao: item.descricao
                    }))
                );

                card.innerHTML = lista.map(criarCard).join("");
            } catch (erro) {
                console.error("Falha ao buscar apiários:", erro);
                card.innerHTML = "<p>Erro de conexão ao carregar os apiários.</p>";
            }
        }

        async function atualizarTemperaturas() {
            const empresaId = sessionStorage.EMPRESA_ID;
            if (!empresaId) return;

            try {
                const resposta = await fetch(`/apiarios/${empresaId}`);
                if (!resposta.ok) return;

                const lista = await resposta.json();
                card.innerHTML = lista.map(criarCard).join("");
            } catch (erro) {
                console.error("Falha ao atualizar temperaturas:", erro);
            }
        }

        carregarApiarios();
        setInterval(atualizarTemperaturas, 500);
    </script>
</body>
</html>
