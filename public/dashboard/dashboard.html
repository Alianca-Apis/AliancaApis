<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliança Apis | Dashboard</title>
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <script src="https://kit.fontawesome.com/a6f961102e.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="margin-top: 0px; overflow-y: hidden;">
    <section class="main">
        <div class="sidebar" id="sidebar">
            <a href="../index.html"><img src="../assets/imgs/logo-main.png"></a>
            <a class="sidebar-active" href="dashboard.html"><i class="fa-solid fa-chart-line"></i>Dashboard</a>
            <a href="apiarios.html"><i class="fa-solid fa-jar"></i>Apiários</a>
            <a href="historico.html"><i class="fa-solid fa-clock-rotate-left"></i>Histórico</a>
            <hr>
        </div>

        <div class="content">
            <div class="titulo-sessão">
                <h2>Dashboard</h2>
                <hr>
                <br>
            </div>

            <div class="box-info" style="margin-top: 16px;">
                <div class="card-unidade vermelho">
                    <div>
                        <h3>Apiários Críticos</h3>
                        <p id="qtd_critico">Quantidade: -</p>
                    </div>
                </div>
                <div class="card-unidade amarelo">
                    <div>
                        <h3>Apiários em Observação</h3>
                        <p id="qtd_alerta">Quantidade: -</p>
                    </div>
                </div>
                <div class="card-unidade verde">
                    <div>
                        <h3>Apiários sob Controle</h3>
                        <p id="qtd_ideal">Quantidade: -</p>
                    </div>
                </div>
            </div>

            <div style="margin: 16px 0; display:flex; align-items:center; gap:10px;">
                <label for="select-apiario" style="font-weight:500;">Selecionar Apiário:</label>
                <select class="select-apiario" id="select-apiario" onchange="exibirAquario(this.value)"></select>
            </div>

            <div class="graficos">
                <div class="caixa">
                    <center><h2>Temperatura Apiário</h2></center>
                    <div id="graficos"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="../js/sessao.js"></script>

    <script>
        const empresaId = sessionStorage.getItem("EMPRESA_ID");

        async function carregarKpis() {
            try {
                const res = await fetch(`/leitura/kpis?empresaId=${empresaId}`);
                if (!res.ok) return;
                const dados = await res.json();
                qtd_critico.innerHTML = `Quantidade: ${dados.critico}`;
                qtd_alerta.innerHTML = `Quantidade: ${dados.alerta}`;
                qtd_ideal.innerHTML = `Quantidade: ${dados.ideal}`;
            } catch (e) {
                console.error("Erro ao carregar KPIs:", e);
            }
        }

        let proximaAtualizacao;

        function exibirAquariosDoUsuario() {
            var aquarios = JSON.parse(sessionStorage.getItem("AQUARIOS") || "[]");
            console.log("AQUARIOS:", aquarios);

            if (aquarios.length === 0) {
                document.getElementById("graficos").innerHTML = "<p>Nenhum apiário encontrado.</p>";
                return;
            }

            aquarios.forEach(item => {
                document.getElementById("select-apiario").innerHTML += `
                    <option value="${item.idApiario}">${item.descricao}</option>
                `;

                document.getElementById("graficos").innerHTML += `
                    <div id="grafico${item.idApiario}" style="display:none;">
                        <h3 class="tituloGraficos">
                            <span id="tituloApiario${item.idApiario}">${item.descricao}</span>
                        </h3>
                        <div class="graph" style="position:relative; height:300px; width:100%;">
                            <canvas id="canvas${item.idApiario}"></canvas>
                        </div>
                        <div class="label-captura">
                            <p id="avisoCaptura${item.idApiario}" style="color: orange; font-size: 13px; margin-top: 6px;"></p>
                        </div>
                    </div>
                `;

                obterDadosGrafico(item.idApiario);
            });

            if (aquarios.length > 0) {
                exibirAquario(aquarios[0].idApiario);
            }
        }

        function alterarTitulo(idApiario) {
            var tituloApiario = document.getElementById(`tituloApiario${idApiario}`);
            var descricao = JSON.parse(sessionStorage.getItem("AQUARIOS")).find(item => item.idApiario == idApiario).descricao;
            tituloApiario.innerHTML = "<center> Últimas leituras de Temperatura do <span style='color: #865D1D'>" + descricao + "</span> <center>";
        }

        function exibirAquario(idApiario) {
            let aquarios = JSON.parse(sessionStorage.getItem("AQUARIOS") || "[]");

            aquarios.forEach(item => {
                const grafico = document.getElementById(`grafico${item.idApiario}`);
                if (item.idApiario == idApiario) {
                    grafico.style.display = "block";
                } else {
                    grafico.style.display = "none";
                }
            });
        }

        // O gráfico é construído com três funções:
        // 1. obterDadosGrafico  → Busca os dados históricos no banco para montar o gráfico pela primeira vez
        // 2. plotarGrafico      → Monta o gráfico com os dados recebidos e o exibe em tela
        // 3. atualizarGrafico   → Atualiza o gráfico periodicamente, buscando a leitura mais recente

        //     Se quiser alterar a busca, ajuste as regras de negócio no controller.
        //     Para ajustar o "select", ajuste o comando SQL no model.
        function obterDadosGrafico(idApiario) {
            alterarTitulo(idApiario);

            if (proximaAtualizacao != undefined) {
                clearTimeout(proximaAtualizacao);
            }

            fetch(`/leitura/buscarLeitura/${idApiario}`, { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {
                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                            resposta.reverse();

                            const LIMITE_LEITURAS = 20;
                            const dadosLimitados = resposta.slice(-LIMITE_LEITURAS);

                            plotarGrafico(dadosLimitados, idApiario);
                        });
                    } else {
                        console.error('Nenhum dado encontrado ou erro na API');
                    }
                })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
        }

        function plotarGrafico(resposta, idApiario) {
            console.log('Iniciando plotagem do gráfico...');

            let labels = [];

            let dados = {
                labels: labels,
                datasets: [{
                    label: 'Temperatura (°C)',
                    data: [],
                    fill: false,
                    borderColor: '#865D1D',
                    backgroundColor: '#865D1D',
                    tension: 0.4
                }]
            };

            console.log('----------------------------------------------');
            console.log('Estes dados foram recebidos por "obterDadosGrafico" e passados para "plotarGrafico":');
            console.log(resposta);

            for (let i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                labels.push(registro.momento_grafico);
                dados.datasets[0].data.push(registro.temperatura);
            }

            console.log('----------------------------------------------');
            console.log('O gráfico será plotado com os respectivos valores:');
            console.log('Labels:', labels);
            console.log('Dados:', dados.datasets);
            console.log('----------------------------------------------');

           let myChart = new Chart(
                document.getElementById(`canvas${idApiario}`),
                { 
                    type: 'line', 
                    data: dados, 
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false }
                    } 
                }
            );

            // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
            setTimeout(() => atualizarGrafico(idApiario, dados, myChart), 2000);
        }

        //     Se quiser alterar a busca, ajuste as regras de negócio no controller.
        //     Para ajustar o "select", ajuste o comando SQL no model.
        function atualizarGrafico(idApiario, dados, myChart) {
            fetch(`/leitura/buscarLeitura/${idApiario}`, { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (novoRegistro) {
                            console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                            console.log('Dados atuais do gráfico:');
                            console.log(dados);

                            let avisoCaptura = document.getElementById(`avisoCaptura${idApiario}`);
                            avisoCaptura.innerHTML = "";

                            if (novoRegistro[0].momento_grafico == dados.labels[dados.labels.length - 1]) {
                                console.log("---------------------------------------------------------------");
                                console.log("Como não há dados novos para captura, o gráfico não atualizará.");
                                console.log("Horário do novo dado capturado:", novoRegistro[0].momento_grafico);
                                console.log("Horário do último dado no gráfico:", dados.labels[dados.labels.length - 1]);
                                console.log("---------------------------------------------------------------");
                                avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Dado mais atual capturado pelo sensor. Como não há dados novos a exibir, o gráfico não atualizará.";
                            } else {
                                const LIMITE_LEITURAS = 20;

                                if (dados.labels.length >= LIMITE_LEITURAS) {
                                    dados.labels.shift();
                                    dados.datasets[0].data.shift();
                                }

                                dados.labels.push(novoRegistro[0].momento_grafico);
                                dados.datasets[0].data.push(novoRegistro[0].temperatura);
                                myChart.update();
                            }

                            // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                            proximaAtualizacao = setTimeout(() => atualizarGrafico(idApiario, dados, myChart), 2000);
                        });
                    } else {
                        console.error('Nenhum dado encontrado ou erro na API');
                        // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                        proximaAtualizacao = setTimeout(() => atualizarGrafico(idApiario, dados, myChart), 2000);
                    }
                })
                .catch(function (error) {
                    console.error(`Erro na atualização do gráfico: ${error.message}`);
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(idApiario, dados, myChart), 2000);
                });
        }

        window.onload = function () {
            carregarKpis();
            exibirAquariosDoUsuario();
        };
    </script>
</body>
</html>
